<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17" />
      <stop offset="50%" stop-color="#121626" />
      <stop offset="100%" stop-color="#070910" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6cff" />
      <stop offset="40%" stop-color="#5865f2" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="primaryShapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="liveBeacon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Base Superellipse / Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" filter="url(#shadowFilter)" />

  <!-- Subtle Inner Glass Top Highlight -->
  <path d="M 28 136 C 28 76 76 28 136 28 L 376 28 C 436 28 484 76 484 136 L 484 210 C 360 230 152 230 28 210 Z" fill="url(#glassGloss)" />

  <!-- Ambient Radial Glow behind the icon -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.18" filter="url(#coreGlow)" />
  <circle cx="340" cy="180" r="70" fill="#38bdf8" opacity="0.22" filter="url(#coreGlow)" />

  <!-- Presence Broadcast Radar Waves (Radiating from beacon) -->
  <g opacity="0.45" stroke="#7c6cff" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 330 110 A 100 100 0 0 1 420 200" stroke-dasharray="8 8" opacity="0.4" />
    <path d="M 320 80 A 140 140 0 0 1 450 210" opacity="0.25" />
  </g>

  <!-- ================= ICONIC LOGO MARK ================= -->
  <!-- Main "P" + Presence Wave Glyph -->
  <g filter="url(#coreGlow)">
    <!-- Vertical Spine of the 'P' with curved pill terminal -->
    <rect x="136" y="116" width="56" height="280" rx="28" fill="url(#primaryShapeGrad)" />
    
    <!-- Curved Head of the 'P' fusing into active pulse shape -->
    <path d="M 164 116 L 272 116 C 336 116 384 164 384 228 C 384 292 336 340 272 340 L 164 340 Z" fill="url(#primaryShapeGrad)" />

    <!-- Negative Space Cutout inside the 'P' head -->
    <path d="M 192 172 L 268 172 C 302 172 328 198 328 228 C 328 258 302 284 268 284 L 192 284 Z" fill="#0c101c" />

    <!-- Dynamic Signal Wave Ribbon cutting through the center -->
    <path d="M 136 290 Q 220 290 280 230 T 400 170" fill="none" stroke="url(#accentGlow)" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- Active Online Live Beacon (The iconic green Discord status orb) -->
  <g filter="url(#beaconGlow)">
    <circle cx="370" cy="144" r="34" fill="#0b0e17" />
    <circle cx="370" cy="144" r="26" fill="url(#liveBeacon)" stroke="#ffffff" stroke-width="3" />
    <!-- Pulse ring around beacon -->
    <circle cx="370" cy="144" r="42" fill="none" stroke="#10b981" stroke-width="3.5" opacity="0.6" stroke-dasharray="6 4" />
  </g>
</svg>
